name: Project Brain

on:
  pull_request:
    branches: [ main, master, develop, dev ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run brain:health
      - run: npm run brain:guard
